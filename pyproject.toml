[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iphonebridge"
version = "0.1.0"
description = "Bluetooth bridge from iPhone to Linux desktop — SMS + notifications + contacts"
authors = [{name = "Gabriel Meir", email = "gabriel@shatunovsky.com"}]
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "typer>=0.12",
  # NOTE: dbus-python and PyGObject are installed via apt
  # (python3-dbus, python3-gi) and intentionally NOT pulled from PyPI —
  # the PyPI versions are notoriously fragile to build. The venv that
  # runs this package should be created with --system-site-packages.
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]

[project.scripts]
iphonebridge = "iphonebridge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
  "B904",   # `raise ... from err` not enforced — too pedantic for this size of project
  "RUF005", # iterable unpacking vs `+` — readability is a wash here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # tests can have long lines for readability of bMessage fixtures
