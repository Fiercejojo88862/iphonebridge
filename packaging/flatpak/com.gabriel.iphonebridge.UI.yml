# Flatpak manifest — iphonebridge-ui (the GTK4 desktop app only).
#
# The daemon is deliberately NOT packaged here: it needs privileged setup
# (adapter Class-of-Device via btmgmt, the BLE-bearer file edit, oFono) that
# cannot run inside a Flatpak sandbox. Install the daemon natively (see the
# repo README); this Flatpak is the UI, which reaches the native daemon over
# the session bus.
#
# STATUS: ready to build — ui/client.py now uses Gio GDBus (no dbus-python
# / system-bus dependency). The sandboxed UI talks only to the session bus.

id: com.gabriel.iphonebridge.UI
runtime: org.gnome.Platform
runtime-version: '47'   # bump to the current stable GNOME runtime
sdk: org.gnome.Sdk
command: iphonebridge-ui

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Reach the native iphonebridge daemon — it owns this name on the session bus.
  - --talk-name=com.gabriel.iphonebridge
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # Read the daemon's config + state files (local.env, events.jsonl,
  # contacts.sqlite). XDG dirs, read-only.
  - --filesystem=xdg-config/iphonebridge:ro
  - --filesystem=xdg-state/iphonebridge:ro

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: iphonebridge-ui
    buildsystem: simple
    build-commands:
      # Install the Python package. The UI entry point is iphonebridge-ui.
      # --no-deps: typer is only used by the CLI, which this Flatpak does not
      # ship; PyGObject + GTK4 + libadwaita come from the GNOME runtime.
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 data/com.gabriel.iphonebridge.UI.desktop /app/share/applications/com.gabriel.iphonebridge.UI.desktop
      - install -Dm644 data/com.gabriel.iphonebridge.UI.metainfo.xml /app/share/metainfo/com.gabriel.iphonebridge.UI.metainfo.xml
      - install -Dm644 data/icons/com.gabriel.iphonebridge.UI.svg /app/share/icons/hicolor/scalable/apps/com.gabriel.iphonebridge.UI.svg
    sources:
      - type: dir
        path: ../..
